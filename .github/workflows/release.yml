name: Upload Codex plugin candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install PyYAML
      - name: Test and validate
        run: |
          python -m unittest discover -s tests
          python .github/validators/validate_plugin.py plugins/kuaiqing
          python .github/validators/quick_validate.py plugins/kuaiqing/skills/kuaiqing-account-connection
          python .github/validators/quick_validate.py plugins/kuaiqing/skills/kuaiqing-skill-manager
      - name: Build immutable candidate ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python -c 'import json,os; p=json.load(open("plugins/kuaiqing/.codex-plugin/plugin.json")); assert p["version"] == os.environ["VERSION"]'
          mkdir -p dist
          git archive --format=zip --output="dist/kuaiqing-${VERSION}.zip" "${GITHUB_SHA}:plugins/kuaiqing"
          git log -1 --pretty=%B > dist/release-notes.txt
      - name: Upload candidate to KuaiQing SaaS
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl --fail-with-body \
            -H "Authorization: Bearer ${KUAIQING_SAAS_CI_TOKEN}" \
            -F "version=${VERSION}" \
            -F "git_tag=${GITHUB_REF_NAME}" \
            -F "git_commit_sha=${GITHUB_SHA}" \
            -F "release_notes=<dist/release-notes.txt" \
            -F "package=@dist/kuaiqing-${VERSION}.zip;type=application/zip" \
            https://my.kuaiqingweb.com/api/internal/codex/plugins/releases
        env:
          KUAIQING_SAAS_CI_TOKEN: ${{ secrets.KUAIQING_SAAS_CI_TOKEN }}
